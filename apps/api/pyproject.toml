[project]
name = "papermemory-api"
version = "0.1.0"
description = "Local-first PaperMemory FastAPI backend skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.0",
  "qdrant-client>=1.11.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
visrag = [
  "Pillow>=10.1.0",
  "sentencepiece>=0.1.99",
  "torch>=2.1.2",
  "torchvision>=0.16.2",
  "transformers>=4.40.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
